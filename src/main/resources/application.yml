# Base configuration shared by all profiles. Secrets have no usable defaults here:
# activate the "dev" profile locally (SPRING_PROFILES_ACTIVE=dev) or provide environment variables (see .env.example).
spring:
  application:
    name: mygateapp-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mygateapp}
    username: ${DB_USERNAME:mygateapp}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates it
    properties:
      hibernate:
        # No hibernate.jdbc.time_zone: Instants are bound as UTC offsets anyway, and that setting shifted
        # LocalTime values (guard shifts) by the JVM's offset when the JVM was not running in UTC.
        jdbc:
          batch_size: 50
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:mygateapp}
    access-token-ttl: ${JWT_ACCESS_EXPIRATION:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_EXPIRATION:P30D}
  otp:
    length: 6
    ttl: ${OTP_TTL:PT5M}
    max-attempts: 5
    resend-cooldown: PT30S
    max-requests-per-mobile-per-hour: 5
    max-requests-per-ip-per-hour: 30
    fixed-code: ${OTP_FIXED_CODE:}
  sms:
    provider: ${SMS_PROVIDER:none}      # none | mock (dev/test only) | twilio
    account-id: ${SMS_ACCOUNT_ID:}
    api-key: ${SMS_API_KEY:}
    sender-id: ${SMS_SENDER_ID:}
    base-url: ${SMS_BASE_URL:https://api.twilio.com}
  push:
    provider: ${PUSH_PROVIDER:log}      # log | firebase
    firebase-credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    max-attempts: 5
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:240}
  files:
    storage-dir: ${FILE_STORAGE_DIR:./data/uploads}
    max-size: 5MB
    url-ttl: PT1H
    public-base-url: ${PUBLIC_BASE_URL:}
  idempotency:
    ttl: PT24H
  jobs:
    enabled: ${JOBS_ENABLED:true}
  dev:
    seed: false
