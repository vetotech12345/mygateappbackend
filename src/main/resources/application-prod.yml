# Production. Every secret must come from the environment; missing values stop the application.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

server:
  forward-headers-strategy: framework   # trust X-Forwarded-* from the reverse proxy / load balancer

app:
  jwt:
    secret: ${JWT_SECRET}
  sms:
    provider: ${SMS_PROVIDER}
  push:
    provider: ${PUSH_PROVIDER:firebase}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  dev:
    seed: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
